<div class="container mt-4">
  <ng-container *ngIf="customers | async as listCustomers; else failureOrLoading">
    <div class="card shadow-sm">
      <div class="card-header bg-primary text-white fs-5">
        Customers
      </div>
      <div class="card-body">
        <form *ngIf="searchFormGroup" [formGroup]="searchFormGroup" (ngSubmit)="handleSearchCustomers()" class="mb-3">
          <div class="input-group input-group-lg">
            <span class="input-group-text bg-info text-white">Search</span>
            <input type="text" formControlName="keyword" class="form-control" placeholder="Enter keyword">
            <button class="btn btn-info text-white">
              <i class="bi bi-search"></i>
            </button>
          </div>
        </form>
        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th class="text-center">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr *ngFor="let c of customers | async">
              <td>{{c.id}}</td>
              <td>{{c.name}}</td>
              <td>{{c.email}}</td>
              <td class="text-center">
                <button (click)="handleCustomerAccounts(c)" class="btn btn-success btn-sm me-2">
                  <i class="bi bi-wallet2"></i> Accounts
                </button>
                <button (click)="handleDeleteCustomer(c)" class="btn btn-danger btn-sm">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </ng-container>
  <ng-template #failureOrLoading>
    <ng-container *ngIf="errorMessage; else loading">
      <div class="alert alert-danger mt-3">{{errorMessage}}</div>
    </ng-container>
    <ng-template #loading>
      <div class="d-flex justify-content-center align-items-center mt-5">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <span class="ms-2 fw-bold">Loading Customers...</span>
      </div>
    </ng-template>
  </ng-template>
</div>

<div class="container py-4">
  <div class="row g-4">

    <!-- ACCOUNTS -->
    <div class="col-md-6">
      <div class="card shadow-sm border-0 rounded-4">
        <div class="card-header bg-primary text-white fw-bold rounded-top-4">
          Accounts
        </div>

        <div class="card-body">
          <form [formGroup]="accountFormGroup" (ngSubmit)="handleSearchAccount()">
            <div class="input-group mb-3">
              <span class="input-group-text">Account ID</span>
              <input type="text" formControlName="accountId" class="form-control" placeholder="Enter account id">
              <button class="btn btn-outline-primary">
                <i class="bi bi-search"></i>
              </button>
            </div>
          </form>

          <ng-template #errorTemplate>
            <ng-container *ngIf="errorMessage ; else loading">
              <div class="alert alert-danger py-2">{{errorMessage}}</div>
            </ng-container>
            <ng-template #loading>
              <div class="text-muted">Loading...</div>
            </ng-template>
          </ng-template>

          <ng-container *ngIf="accountObservable | async as accountDetails">

            <div class="d-flex justify-content-between align-items-center mb-3 p-2 bg-light rounded">
              <div>
                <div class="text-muted small">Account</div>
                <div class="fw-bold">{{accountDetails.accountId}}</div>
              </div>
              <div class="text-end">
                <div class="text-muted small">Balance</div>
                <div class="fw-bold text-success">
                  {{accountDetails.balance | number : '1.2-2'}}
                </div>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                <tr>
                  <th>ID</th>
                  <th>Date</th>
                  <th>Type</th>
                  <th class="text-end">Amount</th>
                </tr>
                </thead>
                <tbody>
                <tr *ngFor="let op of accountDetails.accountOperationDTOS">
                  <td>{{op.id}}</td>
                  <td>{{op.operationDate | date : 'dd/MM/yyyy HH:mm:ss'}}</td>
                  <td>
                      <span
                        class="badge"
                        [ngClass]="{
                          'bg-success': op.type=='CREDIT',
                          'bg-danger': op.type=='DEBIT',
                          'bg-warning text-dark': op.type=='TRANSFER'
                        }">
                        {{op.type}}
                      </span>
                  </td>
                  <td class="text-end fw-semibold">
                    {{op.amount | number : '1.2-2'}}
                  </td>
                </tr>
                </tbody>
              </table>
            </div>

            <div class="d-flex flex-wrap mt-3">
              <button
                *ngFor="let item of [].constructor(accountDetails.totalPages); let page=index"
                class="btn btn-sm me-2 mb-2"
                [ngClass]="page==currentPage ? 'btn-primary' : 'btn-outline-primary'"
                (click)="gotoPage(page)">
                {{page + 1}}
              </button>
            </div>

          </ng-container>
        </div>
      </div>
    </div>

    <!-- OPERATIONS -->
    <div class="col-md-6">
      <div class="card shadow-sm border-0 rounded-4" *ngIf="accountObservable">
        <div class="card-header bg-success text-white fw-bold rounded-top-4">
          Operations
        </div>

        <div class="card-body">
          <form [formGroup]="operationFromGroup" (ngSubmit)="handleAccountOperation()">

            <div class="mb-3 d-flex gap-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" formControlName="operationType" value="DEBIT">
                <label class="form-check-label">Debit</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" formControlName="operationType" value="CREDIT">
                <label class="form-check-label">Credit</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" formControlName="operationType" value="TRANSFER">
                <label class="form-check-label">Transfer</label>
              </div>
            </div>

            <div class="mb-3" *ngIf="operationFromGroup.value.operationType=='TRANSFER'">
              <label class="form-label">Destination Account</label>
              <input type="text" formControlName="accountDestination" class="form-control" placeholder="Account ID">
            </div>

            <div class="mb-3">
              <label class="form-label">Amount</label>
              <input type="number" formControlName="amount" class="form-control" placeholder="0.00">
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <input type="text" formControlName="description" class="form-control" placeholder="Operation description">
            </div>

            <div class="d-grid">
              <button class="btn btn-success btn-lg">
                Save Operation
              </button>
            </div>

          </form>
        </div>
      </div>
    </div>

  </div>
</div>
